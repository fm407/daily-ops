[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]  # gcloud and the demo browser run as argument lists, never through a shell

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
